[General]
sim-time-limit = 10s
record-eventlog = false
repeat = 1

**.vector-recording = false
allow-object-stealing-on-deletion=true
network = MLONetwork
*.scenarioManager.script = xmldoc("scenario.xml")

**.printPkDetail = false
**.hasStatus = true # nodes should have status information to be able to simulate failure

# PCAP recording fails without these lines
**.checksumMode = "computed"
**.fcsMode = "computed"

# following settings apply both STAs and APs
**.arp.typename = "GlobalArp"
**.protocol = "ieee80211be"
**.numWlanInterfaces = 2
**.numAntennas = 2
**.radio.bandwidth = 20MHz
**.radio.receiver.modulation = "QAM-64"
**.pendingQueue.packetCapacity = 500

# access point
*.accessPoint.lmac[0].mgmt.ssid = "wlan2.4"
*.accessPoint.lmac[1].mgmt.ssid = "wlan5"

# STA
*.host*.lmac[0].agent.defaultSsid = "wlan2.4"
*.host*.lmac[1].agent.defaultSsid = "wlan5"
*.host1.lmac[*].address = "0A:BB:00:00:00:01"
*.host2.lmac[*].address = "0A:BB:00:00:00:02"
*.host3.lmac[*].address = "0A:BB:00:00:00:03"
*.host4.lmac[*].address = "0A:BB:00:00:00:04"

**.lmac[0].radio.bandName = "2.4 GHz"
**.lmac[1].radio.bandName = "5 GHz (20 MHz)"

# one radio medium per band (lmac[0] uses the default "radioMedium")
**.lmac[1].radio.radioMediumModule = "radioMedium5GHz"

# U-MAC unifies the addresses of all links after the configurator has run, so the
# configurator's static routes may point to gateway addresses that no longer exist.
# Directly connected (netmask) routes are sufficient within the BSS.
*.configurator.addStaticRoutes = false

**.lmac[0].bitrate = 52Mbps # Ieee80211ModeSet/findMode()
**.lmac[1].bitrate = 130Mbps

# UDP traffic configuration
*.host*.numApps = 1
*.host*.app[0].localPort = 5000
*.host*.app[0].destPort = 5000
*.host*.app[0].packetName = "UDPData" # IMPORTANT: this name is used to extract statistics
*.host*.app[0].messageLength = 1000B
# randomized so that the senders do not start transmitting at precisely the same instant
*.host*.app[0].startTime = uniform(5s, 5.1s)

*.host1.app[0].typename = "UdpBasicApp"
*.host1.app[0].destAddresses = "host2"

*.host2.app[0].typename = "UdpSink"
*.host2.app[0].localPort = 5000

*.host3.app[0].typename = "UdpBasicApp"
*.host3.app[0].destAddresses = "host4"

*.host4.app[0].typename = "UdpSink"
*.host4.app[0].localPort = 5000

**.host*.app[*].dscp = 0 
# Random host placement in 50x50 field
*.host*.mobility.initFromDisplayString = false
*.host*.mobility.initialX = uniform(375m, 425m)
*.host*.mobility.initialY = uniform(175m, 225m)
*.host*.mobility.typename = "StationaryMobility"

*.accessPoint.lmac[*].mgmt.beaconInterval = 131072us

## visualizers
**.numMediumVisualizers = 4
**.displaySignals = true

*.visualizer.mediumVisualizer[0].nodeFilter = "host1"
*.visualizer.mediumVisualizer[0].signalColor = "red"
*.visualizer.mediumVisualizer[1].nodeFilter = "host2"
*.visualizer.mediumVisualizer[1].signalColor = "blue"

*.visualizer.mediumVisualizer[2].nodeFilter = "accessPoint"
*.visualizer.mediumVisualizer[2].interfaceFilter = "lmac[0]"
*.visualizer.mediumVisualizer[2].signalColor = "yellow"

*.visualizer.mediumVisualizer[3].mediumModule = "radioMedium5GHz"

*.visualizer.numDataLinkVisualizers = 2

*.visualizer.dataLinkVisualizer[*].displayLinks = true
*.visualizer.dataLinkVisualizer[*].activityLevel = "peer"

*.visualizer.dataLinkVisualizer[0].nodeFilter = "host1 or accessPoint"
*.visualizer.dataLinkVisualizer[0].lineColor = "red"
*.visualizer.dataLinkVisualizer[0].labelColor = "red"
*.visualizer.dataLinkVisualizer[1].nodeFilter = "accessPoint or host2"
*.visualizer.dataLinkVisualizer[1].lineColor = "darkblue"
*.visualizer.dataLinkVisualizer[1].labelColor = "darkblue"

*.visualizer.ieee80211Visualizer[0].displayAssociations = true

# disable 802.11 fragmentation and aggregation
**.hcf.originatorMacDataService.fragmentationPolicy.fragmentationThreshold = 10000B
**.hcf.originatorMacDataService.msduAggregationPolicy.aggregationLengthThreshold = 10000
**.lmac[*].mac.hcf.recipientBlockAck.blockAckAgreementPolicy.delayedAckPolicySupported = true
**.lmac[*].mac.hcf.originatorBlockAck.blockAckAgreementPolicy.delayedAckPolicySupported = true
**.lmac[*].mac.hcf.originatorAckPolicy.maxBlockAckPolicyFrameLength = 50000B
**.lmac[*].mac.hcf.originatorBlockAckAgreementPolicy.blockAckTimeoutValue = 30s
**.lmac[*].mac.hcf.recipientBlockAckAgreementPolicy.blockAckTimeoutValue = 30s
# Set the threshold for initiating an ADDBA request
**.lmac[*].mac.hcf.originatorBlockAckAgreementPolicy.addbaRequestThreshold = 1

**.lmac[*].mac.hcf.originatorAckPolicy.blockAckTimeout = 1s
#**.lmac[*].mac.hcf.originatorAckPolicy.ackTimeout = 0.2s

# Force Block ACK policy for data frames
**.lmac[*].mac.hcf.originatorAckPolicy.maxBlockAckPolicyFrameLength = 10000B

#Measure energy consumption
*.host*.energyStorage.typename = "IdealEpEnergyStorage"
*.host*.lmac[*].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"
*.host*.lmac[*].radio.energyConsumer.energySourceModule = "^.^.^.energyStorage"


[Config NoTWT]

extends = General
**.umac.typename = "RtwtUMac"
*.host*.app[0].sendInterval = ${interval=100}ms

[Config TWT]

**.classifier.typename = "QosClassifier"
**.lmac[*].mac.twtEnable = true
**.umac.twtEnable = true
**.host*.umac.typename = "RtwtUMac"
*.accessPoint.umac.typename = "RtwtUMacAccessPoint"
*.accessPoint.lmac[*].mgmt.twtEnable = true
*.accessPoint.lmac[*].twtAgent.isStation = false

# Enable Block ACK and qos 
**.lmac[*].mac.hcf.isBlockAckSupported = true
**.lmac[*].mac.qosStation = true
**.lmac[*].mac.hcf.qosAckTimeout = 64ms
**.lmac[*].mac.ackTimeout = 64ms

*.host1.umac.linkRequirements = [{flowId: 1, restriction: 1, dataRate: 2000, latency: 128, wakeTime: 4000000, receiver: "0A:BB:00:00:00:02"}] #dataRate in kb/s
*.host3.umac.linkRequirements = [{flowId: 1, restriction: 1, dataRate: 2000, latency: 128, wakeTime: 4000000, receiver: "0A:BB:00:00:00:04"}] #dataRate in kb/s

*.host*.app[0].sendInterval = ${interval=100}ms
*.accessPoint.umac.twtScheduler.cycleDuration = ${cycl=8,16,32}ms  # Match the beacon interval

**.lmac[*].mac.hcf.edca.edcaf[*].cwMin = 0
**.lmac[*].mac.hcf.edca.edcaf[*].cwMax = 3

*.accessPoint.umac.twtScheduler.minimalInterval = 256
*.accessPoint.umac.twtScheduler.scheduleBuffer = 2  # Buffer between schedules in 256us units
**.lmac[*].twtAgent.scheduleBuffer = 2
*.accessPoint.umac.twtScheduler.typename = ${sched="SymmetricalScheduler","AsymmetricalScheduler","CrossSymmetricalScheduler"}  # Match the beacon interval

*.accessPoint.umac.twtScheduler.practicalBitrate = 65Mbps # Both links STA to AP

*.accessPoint.umac.twtScheduler.dataOverhead = 1.5
#*.accessPoint.umac.twtScheduler.proportionalAlg = ${prop=0}
*.accessPoint.umac.twtBeaconStart = 3.5

